project:
  type: book
  output-dir: docs
  # sitemap.xml is deliberately NOT a resource: it is generated after the HTML
  # render by scripts/make-sitemap.sh, so there is no root copy to copy in.
  resources:
    - "data-webr/*.csv"
    - "robots.txt"
    - "netlify.toml"
    - "google02e424888b5e2def.html"
    - "404.html"

quarto-required: ">=1.6.0"

sitemap: true

book:
  title: "Data Wrangling with R"
  author: "Aravind Hebbali"
  date: last-modified
  description: "R for Data Science teaches the whole game. Data Wrangling with R drills the hardest 20%: joins, grouped summaries, messy strings, datetimes, and factors — on one realistic ecommerce dataset, runnable in your browser."
  chapters:
    - index.qmd
    - 00-author.qmd
    - 01-import-1.qmd
    - 02-import-2.qmd
    - 03-pipes.qmd
    - 04-dplyr-1.qmd
    - 05-dplyr-2.qmd
    - 06-dplyr-3.qmd
    - 07-tibbles.qmd
    - 08-tidyr.qmd
    - 09-stringr.qmd
    - 10-lubridate-parsing.qmd
    - 11-lubridate-arithmetic.qmd
    - 12-factors-fundamentals.qmd
    - 13-forcats-manipulation.qmd
    - 14-solutions.qmd
  appendices:
    - appendices/arrow-duckdb.qmd
    - appendices/legacy-magrittr.qmd
    - appendices/rosetta-pandas.qmd
  downloads: [pdf, epub]

website:
  site-url: https://wrangle-r.rsquaredacademy.com
  description: "R for Data Science teaches the whole game. Data Wrangling with R drills the hardest 20%: joins, grouped summaries, messy strings, datetimes, and factors — on one realistic ecommerce dataset, runnable in your browser."
  open-graph: true
  twitter-card: true
  repo-url: https://github.com/rsquaredacademy-education/wrangle-r
  navbar:
    right:
      - text: "GitHub"
        href: https://github.com/rsquaredacademy-education/wrangle-r

execute:
  freeze: auto
  warning: false

format:
  html:
    # Interactive R cells via WebAssembly (coatless/webr), scoped to HTML:
    # the webr lua filter rewrites the AST and breaks Typst callouts in PDF.
    filters:
      - webr
    theme:
      light: flatly
      dark: darkly
    toc-depth: 3
    search: true
    code-copy: true
    code-tools: true
    code-overflow: wrap
    fig-align: center
    fig-dpi: 192
    include-in-header: [includes/head.html, google-analytics.html]
  pdf:
    # lualatex (not typst): callouts need tcolorbox, which the Typst
    # template cannot provide (same call as viz-ggplot2).
    pdf-engine: lualatex
    papersize: us-letter
    toc-depth: 3
    code-overflow: wrap
    fig-format: png
    fig-dpi: 300
  epub:
    toc-depth: 2
    code-overflow: wrap

language:
  search:
    placeholder: "Search verbs, e.g. semi_join vs anti_join"
