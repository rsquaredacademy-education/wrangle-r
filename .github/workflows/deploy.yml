name: Build & Deploy to Netlify (docs/)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned exactly, never "release". An unpinned Quarto breaks this book
          # with no commit to bisect, and the lualatex PDF path is the most
          # sensitive to upstream change. Verified locally against 1.10.18.
          version: "1.10.18"

      # PDF uses lualatex (callouts via tcolorbox); install TinyTeX.
      - name: Setup TinyTeX
        run: quarto install tinytex

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      # System libs for R `magick` (pulled in via summarytools): RSPM binary
      # links libMagick++-6.Q16.so.9, absent from the base runner image.
      - name: Install system libs
        run: sudo apt-get update && sudo apt-get install -y libmagick++-6.q16-9t64

      # Direct binary install from RSPM (no pak resolution): duckplyr's
      # Suggested `constructive` was archived on CRAN (2026-09-27) and breaks
      # setup-r-dependencies' full resolution on fresh runners.
      - name: Install R packages
        run: >-
          Rscript -e "install.packages(c('knitr', 'rmarkdown', 'dplyr',
          'tidyr', 'readr', 'stringr', 'lubridate', 'forcats', 'tibble',
          'ggplot2', 'haven', 'readxl', 'kableExtra', 'magrittr', 'arrow',
          'duckdb', 'duckplyr', 'gmodels', 'ggpubr', 'plotrix', 'Hmisc',
          'janitor', 'epiDisplay', 'summarytools', 'questionr', 'descriptr',
          'psych', 'skimr', 'tableone', 'desctable'), Ncpus = 4)"

      - name: Legacy syntax lint (must be zero hits)
        run: |
          ! grep -rn --include='*.qmd' -E 'summarise_all|sample_n\(|sample_frac\(' . || { echo "LEGACY CODE FOUND"; exit 1; }
          ! grep -rn --include='*.qmd' -E '%\$%|%<>%|extract2\(|use_series\(' --exclude-dir=appendices . \
            | grep -v 'legacy-magrittr' || { echo "MAGITTR LEAK OUTSIDE APPENDIX"; exit 1; }
          echo "lint clean"

      - name: WebR static smoke (<30s)
        run: Rscript scripts/webr-smoke.R

      - name: Render HTML
        run: quarto render --to html --output-dir /tmp/stage-html

      - name: Install static sitemap (Quarto reserves the path)
        run: cp sitemap.xml /tmp/stage-html/sitemap.xml

      # Fatal, not advisory. These were previously `|| echo "PDF_FAILED=1"`,
      # which let a green build ship with no PDF while the landing page still
      # advertised one. Same reasoning as viz-base's render.yml.
      - name: Render PDF
        run: quarto render --to pdf --output-dir /tmp/stage-pdf

      - name: Render ePub
        run: quarto render --to epub --output-dir /tmp/stage-epub

      - name: Verify preserved slugs
        run: |
          for f in index 00-author 01-import-1 02-import-2 03-pipes 04-dplyr-1 05-dplyr-2 06-dplyr-3 07-tibbles 08-tidyr 09-stringr 10-lubridate-parsing 11-lubridate-arithmetic 12-factors-fundamentals 13-forcats-manipulation 14-solutions; do
            test -f "/tmp/stage-html/$f.html" || { echo "MISSING SLUG: /tmp/stage-html/$f.html"; exit 1; }
          done
          for f in appendices/arrow-duckdb appendices/legacy-magrittr appendices/rosetta-pandas; do
            test -f "/tmp/stage-html/$f.html" || { echo "MISSING SLUG: /tmp/stage-html/$f.html"; exit 1; }
          done
          test -f /tmp/stage-html/sitemap.xml || { echo "sitemap.xml missing from staged output"; exit 1; }
          test -d /tmp/stage-html/data-webr || { echo "data-webr missing from staged output"; exit 1; }

      - name: Assemble docs
        run: |
          rm -rf docs && mkdir -p docs
          cp -r /tmp/stage-html/. docs/
          cp /tmp/stage-pdf/*.pdf docs/
          cp /tmp/stage-epub/*.epub docs/
          cp netlify.toml robots.txt sitemap.xml google02e424888b5e2def.html 404.html docs/ 2>/dev/null || true
          rm -rf docs/docs
          test -f docs/sitemap.xml || { echo "sitemap.xml missing after assemble"; exit 1; }
          ls docs/

      - name: Verify downloads are present
        run: |
          ls /tmp/stage-pdf/*.pdf || { echo "PDF MISSING"; exit 1; }
          ls /tmp/stage-epub/*.epub || { echo "EPUB MISSING"; exit 1; }

      - name: Verify redirects
        run: bash scripts/test-redirects.sh docs

      - name: Link check (advisory)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: "docs/**/*.html --root-dir docs --exclude 'mailto:*'"

      - name: Commit docs
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: rebuild site via ci"
          file_pattern: docs/
